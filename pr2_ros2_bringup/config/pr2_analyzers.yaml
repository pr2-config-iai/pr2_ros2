# Diagnostic analyzers for the PR2 under ROS 2 (diagnostic_aggregator, node "diag_agg").
#
# Taken from ROS 1 pr2_bringup/config/pr2_analyzers.yaml, but only with the groups whose
# diagnostics ROS 2 publishes so far: every expected item that nobody publishes would hold the
# dashboard's diagnostics icon at error. Add the remaining ROS 1 groups (Cameras, Joints) back as
# their drivers are ported, and the tilt Hokuyo to Lasers.
diag_agg:
  ros__parameters:
    motors:
      type: diagnostic_aggregator/GenericAnalyzer
      path: Motors
      # Jazzy's GenericAnalyzer only matches items through startswith/contains/regex; 'expected'
      # (and 'name') only add a "Missing" placeholder. So everything expected must also match one of
      # these, unlike in ROS 1, where 'EtherCAT Master' was matched through 'expected' alone.
      startswith: ['EtherCAT Device', 'EtherCAT Master']
      expected: [
          'EtherCAT Master',
          'EtherCAT Device (bl_caster_l_wheel_motor)',
          'EtherCAT Device (bl_caster_r_wheel_motor)',
          'EtherCAT Device (bl_caster_rotation_motor)',
          'EtherCAT Device (br_caster_l_wheel_motor)',
          'EtherCAT Device (br_caster_r_wheel_motor)',
          'EtherCAT Device (br_caster_rotation_motor)',
          'EtherCAT Device (fl_caster_l_wheel_motor)',
          'EtherCAT Device (fl_caster_r_wheel_motor)',
          'EtherCAT Device (fl_caster_rotation_motor)',
          'EtherCAT Device (fr_caster_l_wheel_motor)',
          'EtherCAT Device (fr_caster_r_wheel_motor)',
          'EtherCAT Device (fr_caster_rotation_motor)',
          'EtherCAT Device (laser_tilt_mount_motor)',
          'EtherCAT Device (head_pan_motor)',
          'EtherCAT Device (head_tilt_motor)',
          'EtherCAT Device (led_projector)',
          'EtherCAT Device (torso_lift_motor)',
          'EtherCAT Device (r_gripper_motor)',
          'EtherCAT Device (r_wrist_l_motor)',
          'EtherCAT Device (r_wrist_r_motor)',
          'EtherCAT Device (r_forearm_roll_motor)',
          'EtherCAT Device (r_elbow_flex_motor)',
          'EtherCAT Device (r_upper_arm_roll_motor)',
          'EtherCAT Device (r_shoulder_lift_motor)',
          'EtherCAT Device (r_shoulder_pan_motor)',
          'EtherCAT Device (l_gripper_motor)',
          'EtherCAT Device (l_wrist_l_motor)',
          'EtherCAT Device (l_wrist_r_motor)',
          'EtherCAT Device (l_forearm_roll_motor)',
          'EtherCAT Device (l_elbow_flex_motor)',
          'EtherCAT Device (l_upper_arm_roll_motor)',
          'EtherCAT Device (l_shoulder_lift_motor)',
          'EtherCAT Device (l_shoulder_pan_motor)']
    # ROS 1 'Realtime Controllers' expected pr2_controller_manager's items ('Realtime Control Loop',
    # 'Controller (...)'). Under ROS 2 the controller manager reports these instead.
    controllers:
      type: diagnostic_aggregator/GenericAnalyzer
      path: Realtime Controllers
      startswith: ['controller_manager', 'Realtime Control Loop']
    # The power board (power_node2) and the batteries (ocean_server on c2, D38), as in ROS 1.
    power:
      type: diagnostic_aggregator/GenericAnalyzer
      path: Power System
      timeout: 10.0
      num_items: 21
      discard_stale: true
      expected: [
          'IBPS 0',
          'IBPS 1',
          'IBPS 2',
          'IBPS 3',
          'Smart Battery 0.0',
          'Smart Battery 0.1',
          'Smart Battery 0.2',
          'Smart Battery 0.3',
          'Smart Battery 1.0',
          'Smart Battery 1.1',
          'Smart Battery 1.2',
          'Smart Battery 1.3',
          'Smart Battery 2.0',
          'Smart Battery 2.1',
          'Smart Battery 2.2',
          'Smart Battery 2.3',
          'Smart Battery 3.0',
          'Smart Battery 3.1',
          'Smart Battery 3.2',
          'Smart Battery 3.3']
      startswith: ['Power board', 'IBPS', 'Smart Battery']
    # ROS 1 also had 'Tilt Hokuyo' (prefix tilt_hokuyo_node, 2 items); its driver only runs with
    # hokuyos.launch.py tilt_laser:=true, as the tilt laser was not used with ROS 1.
    lasers:
      type: diagnostic_aggregator/AnalyzerGroup
      path: Lasers
      analyzers:
        base_hk:
          type: diagnostic_aggregator/GenericAnalyzer
          path: Base Hokuyo
          find_and_remove_prefix: ['base_hokuyo_node']
          num_items: 2
    # ROS 1's Devices group also had the joystick and sound_play; only the IMU is ported so far
    # (imu_node's 3 items + imu_monitor's 'imu_node: Imu Drift Monitor', D42).
    devices:
      type: diagnostic_aggregator/AnalyzerGroup
      path: Devices
      analyzers:
        imu:
          type: diagnostic_aggregator/GenericAnalyzer
          path: IMU
          find_and_remove_prefix: ['imu_node']
          num_items: 4
    # ROS 1's Computers group (pr2_computer_monitor, D44), without Network (wifi_monitor, not
    # ported). The expected items are the ones the monitors publish: ROS 1 expected 'NTP offset from
    # c1 to 10.68.255.1', but its pr2.launch checks 0.de.pool.ntp.org, and did not expect c2's HD
    # Usage, which its pr2-c2.launch did publish.
    computers:
      type: diagnostic_aggregator/AnalyzerGroup
      path: Computers
      analyzers:
        cpu:
          type: diagnostic_aggregator/GenericAnalyzer
          path: CPU
          startswith: ['c1 CPU', 'c1 HD', 'c2 CPU', 'c2 HD']
          expected: [
              'c1 CPU Temperature',
              'c1 CPU Usage',
              'c1 HD Temperature',
              'c1 HD Usage',
              'c2 CPU Temperature',
              'c2 CPU Usage',
              'c2 HD Temperature',
              'c2 HD Usage']
        clocks:
          type: diagnostic_aggregator/GenericAnalyzer
          path: Clocks
          timeout: 20.0
          startswith: ['NTP offset from', 'NTP self-offset for']
          expected: [
              'NTP offset from c1 to 0.de.pool.ntp.org',
              'NTP offset from c2 to c1',
              'NTP self-offset for c1',
              'NTP self-offset for c2']
